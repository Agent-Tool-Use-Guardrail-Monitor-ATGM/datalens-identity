name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IDENTITY_DATABASE_TESTS: "1"
      IDENTITY_RUNTIME_TESTS: "1"
      IDENTITY_MESSAGING_ROOT: test-results/messaging
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check out verified messaging topology
        uses: actions/checkout@v7
        with:
          repository: Agent-Tool-Use-Guardrail-Monitor-ATGM/datalens-messaging
          ref: 25b2afabeff049834355c19add7061d557639120
          path: test-results/messaging
          persist-credentials: false
      - name: Install test tooling
        run: python -m pip install -r requirements.txt
      - name: Install pinned Chromium
        # The Ubuntu 24.04 runner supplies the native libraries used by the browser tests.
        run: python -m playwright install chromium
      - name: Start disposable identity runtime
        run: docker compose -p datalens-identity-tests -f compose.test.yaml -f compose.runtime.test.yaml up -d --build --wait --wait-timeout 180
      - name: Run tests
        run: python -m pytest -q
      - name: Remove disposable identity runtime
        if: always()
        run: docker compose -p datalens-identity-tests -f compose.test.yaml -f compose.runtime.test.yaml down
