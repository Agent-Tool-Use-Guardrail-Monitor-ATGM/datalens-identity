[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra --strict-config --strict-markers"
markers = ["runtime: requires the disposable Keycloak runtime", "postgres: requires the explicitly enabled disposable identity database fixture"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
