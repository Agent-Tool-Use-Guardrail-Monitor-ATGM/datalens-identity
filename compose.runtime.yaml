# Add to the matching database Compose file; PostgreSQL storage remains unchanged.
services:
  keycloak:
    build:
      context: .
      dockerfile: docker/keycloak/Dockerfile
    command: ["start", "--optimized"]
    environment:
      KC_DB_URL: jdbc:postgresql://identity-postgres:5432/identity_db
      KC_DB_USERNAME: identity_app
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_CACHE: local
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9001:9000"
    depends_on:
      identity-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 40
    mem_limit: 768m
