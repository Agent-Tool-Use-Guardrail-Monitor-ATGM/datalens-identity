# Development identity database only; no agent or Keycloak runtime here.
name: datalens-identity-local

services:
  identity-postgres:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: identity_bootstrap
      POSTGRES_PASSWORD: ${IDENTITY_DB_BOOTSTRAP_PASSWORD:?Set IDENTITY_DB_BOOTSTRAP_PASSWORD}
      IDENTITY_DB_USER: identity_app
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - identity-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$IDENTITY_DB_PASSWORD" psql -X --no-password -h 127.0.0.1
          -U "$$IDENTITY_DB_USER" -d "$$POSTGRES_DB" -Atqc 'SELECT 1' >/dev/null 2>&1
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 20

volumes:
  identity-postgres-data:
    # Preserve existing physical storage across service renaming.
    name: ${COMPOSE_PROJECT_NAME}_datalens-identity-postgres-data
