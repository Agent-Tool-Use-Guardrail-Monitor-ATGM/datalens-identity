# Add to the matching database Compose file; PostgreSQL storage remains unchanged.
services:
  identity-keycloak:
    build:
      context: .
      dockerfile: docker/keycloak/Dockerfile
    command: ["start", "--optimized"]
    environment:
      KC_DB_URL: jdbc:postgresql://identity-postgres:5432/identity_test_db
      KC_DB_USERNAME: identity_test
      KC_DB_PASSWORD: identity-test-app-only-password
      KC_HOSTNAME: http://localhost:18081
      KC_HTTP_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_CACHE: local
    ports:
      - "127.0.0.1:18081:8080"
      - "127.0.0.1:19001:9000"
    depends_on:
      identity-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 40
    mem_limit: 768m

  identity-mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_MAX_MESSAGES: "100"
    ports:
      - "127.0.0.1:18025:8025"
