# Disposable fixture only. Fixed synthetic passwords must never be used outside tests.
name: datalens-identity-tests

services:
  identity-postgres:
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_DB: identity_test_db
      POSTGRES_USER: identity_bootstrap
      POSTGRES_PASSWORD: identity-test-bootstrap-only-password
      IDENTITY_DB_USER: identity_test
      IDENTITY_DB_PASSWORD: identity-test-app-only-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$IDENTITY_DB_PASSWORD" psql -X --no-password -h 127.0.0.1
          -U "$$IDENTITY_DB_USER" -d "$$POSTGRES_DB" -Atqc 'SELECT 1' >/dev/null 2>&1
      interval: 2s
      timeout: 3s
      start_period: 10s
      retries: 20
